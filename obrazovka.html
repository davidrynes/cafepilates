<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Obrazovka – Café Pilates</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; cursor: none; }
    .slides { position: relative; width: 100%; height: 100%; }
    .slides img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      opacity: 0;
      -webkit-transition: opacity 5s ease;
      transition: opacity 5s ease;
      will-change: opacity;
    }
    .slides img.is-active { opacity: 1; }
  </style>
</head>
<body>
  <!--
    OBRAZOVKA V KAVÁRNĚ
    Obsah se spravuje v redakčním systému Sanity (studio Café Pilates → „Obrazovka v kavárně“):
    polévky tohoto týdne, další obrázky v libovolném pořadí, vypnutí obrázku nebo jeho omezení
    na období od–do a délka zobrazení. Po uložení („Publish“) se změna na televizi projeví
    do pěti minut, stránku není potřeba obnovovat.

    Obrázky níže jsou jen záloha pro případ, že by Sanity nebylo dostupné (výpadek internetu
    při prvním načtení). Dokud se obsah ze Sanity jednou načte, zůstává na obrazovce i při
    pozdějších výpadcích.
  -->
  <div class="slides" id="slides">
    <img src="/assets/img/obrazovka/polevky.jpg" alt="">
    <img src="/assets/img/obrazovka/tv-menu-01.png" alt="">
    <img src="/assets/img/obrazovka/tv-menu-02.png" alt="">
    <img src="/assets/img/obrazovka/tv-menu-03.png" alt="">
    <img src="/assets/img/obrazovka/tv-menu-04.png" alt="">
    <img src="/assets/img/obrazovka/obrazovka--3.jpg" alt="">
    <img src="/assets/img/obrazovka/obrazovka--4.jpg" alt="">
    <img src="/assets/img/obrazovka/obrazovka--6.jpg" alt="">
    <img src="/assets/img/obrazovka/obrazovka--7.jpg" alt="">
    <img src="/assets/img/obrazovka/obrazovka--8.jpg" alt="">
    <img src="/assets/img/obrazovka/9.jpg" alt="">
    <img src="/assets/img/obrazovka/11.jpg" alt="">
    <img src="/assets/img/obrazovka/10.jpg" alt="">
    <img src="/assets/img/obrazovka/14.jpg" alt="">
    <img src="/assets/img/obrazovka/12.jpg" alt="">
    <img src="/assets/img/obrazovka/barre.jpg" alt="">
    <img src="/assets/img/obrazovka/happy-hours.jpg" alt="">
  </div>

  <script>
    // Psáno bez moderní syntaxe – prohlížeče v televizích bývají staré.
    (function () {
      var SANITY = "https://ija35k0i.apicdn.sanity.io/v2025-02-19/data/query/production";
      var DOTAZ = '*[_id == "obrazovka"][0]{sekundNaObrazek, sekundPrelinani,' +
        ' "polevky": polevky.asset->url,' +
        ' "slides": slides[zobrazovat != false]{od, do, "url": obrazek.asset->url}}';
      var KONTROLA_OBSAHU = 5 * 60 * 1000;        // jak často se podívat, jestli se v Sanity něco nezměnilo
      var OBNOVA_STRANKY = 12 * 60 * 60 * 1000;   // jednou za 12 h načíst stránku znovu

      var kontejner = document.getElementById("slides");
      var slides = [].slice.call(kontejner.getElementsByTagName("img"));
      var prodleva = 8000;
      var prelinani = 5000;
      var i = 0;
      var casovac = null;
      var cekajici = null;   // nová sada obrázků, už stažená, čeká na další přechod
      var verze = null;      // podpis toho, co se právě promítá

      function nastavPrelinani(img) {
        img.style.webkitTransition = img.style.transition = "opacity " + prelinani / 1000 + "s ease";
      }

      function dalsi() {
        var stary = slides[i];
        if (cekajici) {
          // Vyměnit celou sadu: první nový obrázek se prolne přes ten právě promítaný,
          // staré se uklidí, až prolnutí doběhne.
          var odchazejici = slides;
          slides = cekajici;
          cekajici = null;
          i = 0;
          slides[0].className = "is-active";
          stary.className = "";
          setTimeout(function () {
            for (var k = 0; k < odchazejici.length; k++) {
              if (odchazejici[k].parentNode) odchazejici[k].parentNode.removeChild(odchazejici[k]);
            }
          }, prelinani + 500);
          spust();
          return;
        }
        if (slides.length < 2) return;
        stary.className = "";
        i = (i + 1) % slides.length;
        slides[i].className = "is-active";
      }

      function spust() {
        if (casovac) clearInterval(casovac);
        casovac = setInterval(dalsi, prodleva);
      }

      // Dnešní datum v místním čase jako "RRRR-MM-DD", aby šlo porovnat s poli od/do.
      function dnes() {
        var d = new Date();
        function dve(n) { return (n < 10 ? "0" : "") + n; }
        return d.getFullYear() + "-" + dve(d.getMonth() + 1) + "-" + dve(d.getDate());
      }

      // Šířka obrázku, kterou si říct Sanity – podle skutečné obrazovky, nejvýš 2160 px.
      function sirka() {
        var w = Math.round((window.innerWidth || 1080) * (window.devicePixelRatio || 1));
        return Math.max(720, Math.min(2160, w));
      }

      function adresa(url) {
        return url + "?w=" + sirka() + "&fm=jpg&q=85";
      }

      function prijmi(data) {
        if (!data || !data.polevky) return;
        var den = dnes();
        var adresy = [adresa(data.polevky)];
        var seznam = data.slides || [];
        for (var k = 0; k < seznam.length; k++) {
          var s = seznam[k];
          if (!s.url) continue;
          if (s.od && s.od > den) continue;
          if (s["do"] && s["do"] < den) continue;
          adresy.push(adresa(s.url));
        }
        var novaProdleva = (data.sekundNaObrazek || 8) * 1000;
        var novePrelinani = Math.min((data.sekundPrelinani || 0) * 1000, novaProdleva - 1000);
        var podpis = adresy.join("|") + "|" + novaProdleva + "|" + novePrelinani;
        if (podpis === verze) return;

        // Nejdřív všechno stáhnout, teprve pak ukázat – při pomalém internetu
        // by se jinak na televizi objevil prázdný černý obrázek.
        var nove = [];
        var zbyva = adresy.length;
        function hotovo() {
          if (--zbyva > 0) return;
          var nactene = [];
          for (var m = 0; m < nove.length; m++) if (nove[m].naturalWidth) nactene.push(nove[m]);
          if (!nactene.length) return;
          verze = podpis;
          prodleva = novaProdleva;
          prelinani = Math.max(0, novePrelinani);
          for (var n = 0; n < nactene.length; n++) {
            nastavPrelinani(nactene[n]);
            kontejner.appendChild(nactene[n]);
          }
          for (var o = 0; o < slides.length; o++) nastavPrelinani(slides[o]);
          cekajici = nactene;
        }
        for (var j = 0; j < adresy.length; j++) {
          var img = new Image();
          img.alt = "";
          img.onload = img.onerror = hotovo;
          img.src = adresy[j];
          nove.push(img);
        }
      }

      function nactiObsah() {
        var xhr = new XMLHttpRequest();
        xhr.open("GET", SANITY + "?query=" + encodeURIComponent(DOTAZ), true);
        xhr.onload = function () {
          if (xhr.status !== 200) return;
          try { prijmi(JSON.parse(xhr.responseText).result); } catch (e) { /* zůstane, co běží */ }
        };
        xhr.send();
      }

      if (slides.length) slides[0].className = "is-active";
      spust();
      nactiObsah();
      setInterval(nactiObsah, KONTROLA_OBSAHU);

      // Celou stránku obnovit jen tehdy, když je server dostupný (jinak by televize ukázala chybu).
      setInterval(function () {
        var xhr = new XMLHttpRequest();
        xhr.open("HEAD", location.pathname + "?kontrola=" + new Date().getTime(), true);
        xhr.onload = function () { if (xhr.status === 200) location.reload(); };
        xhr.send();
      }, OBNOVA_STRANKY);
    })();
  </script>
</body>
</html>
